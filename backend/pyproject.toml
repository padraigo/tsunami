[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsunami"
version = "0.1.0"
description = "Tsunami simulation engine"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "xarray>=2024.1",
    "netcdf4>=1.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.24",
    "anyio>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tsunami"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
