[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsunami"
version = "0.1.0"
description = "Tsunami simulation engine"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "xarray>=2024.1",
    "netcdf4>=1.6",
    "clawpack>=5.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tsunami"]

[tool.pytest.ini_options]
testpaths = ["tests"]
